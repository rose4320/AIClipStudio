name: Stage 1 browser tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-backup-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/aiclip-http.log 2>&1 &
          echo $! > /tmp/aiclip-http.pid
      - name: Run Stage 1 full-backup integration tests
        run: node tests/stage1-full-backup.mjs
