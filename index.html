<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AIクリスタ 漫画スタジオ v0.2</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#202533;background:#f4f5f8}*{box-sizing:border-box}body{margin:0}header{background:#222b43;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}button{border:1px solid #cbd1dd;border-radius:10px;background:white;padding:11px 14px;font-size:15px;cursor:pointer}button.active,.primary{background:#4158a5;color:white;border-color:#4158a5}.panel{background:white;border:1px solid #e1e4ed;border-radius:16px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}input,textarea,select{width:100%;border:1px solid #cbd1dd;border-radius:9px;padding:11px;font:inherit;margin:7px 0 15px}textarea{min-height:130px;resize:vertical}label{font-weight:600;font-size:14px}.muted{color:#667085;font-size:13px}.hidden{display:none}.asset{border:1px solid #dce1ea;border-radius:12px;padding:13px}.asset img{width:100%;height:125px;object-fit:contain;background:#f3f4f7;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.status{font-size:12px;color:#64748b}.pill{font-size:12px;background:#edf0f8;padding:4px 8px;border-radius:9px}#editorCanvas{width:100%;max-width:430px;aspect-ratio:4299/6071;border:1px solid #999;background:white;touch-action:none} .editor{display:flex;gap:16px;flex-wrap:wrap}.layers{min-width:180px;flex:1}.canvasWrap{flex:2;text-align:center;min-width:240px} .layer{display:flex;align-items:center;justify-content:space-between;border:1px solid #ddd;padding:8px;border-radius:8px;margin:6px 0} @media(max-width:600px){main{padding:10px}.panel{padding:13px}}</style></head><body><header><strong>AIクリスタ 漫画スタジオ <small>v0.2</small></strong><span id="saveStatus" class="status" style="color:#dce4ff">ローカル保存</span></header><main><nav><button data-tab="projects" class="active">作品</button><button data-tab="story">あらすじ</button><button data-tab="script">脚本</button><button data-tab="assets">アセット</button><button data-tab="editor">原稿編集</button></nav><section id="projects" class="panel"><h2>作品管理</h2><div class="toolbar"><button class="primary" id="newProject">＋ 新しい作品</button><button id="exportData">バックアップ書き出し</button><button id="importData">バックアップ読み込み</button><input type="file" id="backupFile" accept="application/json" hidden></div><div id="projectList" class="grid"></div></section><section id="story" class="panel hidden"><h2>あらすじ</h2><label>作品タイトル</label><input id="title" placeholder="作品タイトル"><label>ジャンル</label><input id="genre" placeholder="ホラー、学園、SFなど"><label>世界観・テーマ</label><textarea id="world"></textarea><label>あらすじ</label><textarea id="synopsis" style="min-height:230px"></textarea><button class="primary" id="saveStory">保存</button><p class="muted">AIによる提案機能は今後接続。承認なしの自動書き換えは行いません。</p></section><section id="script" class="panel hidden"><h2>脚本・シナリオ</h2><label>話数・シーン名</label><input id="sceneTitle" placeholder="第1話・冒頭"><label>脚本</label><textarea id="sceneBody" style="min-height:290px" placeholder="場面、演出、セリフを入力"></textarea><button class="primary" id="saveScript">脚本を保存</button></section><section id="assets" class="panel hidden"><h2>アセットライブラリ</h2><div class="toolbar"><button id="scopeProject" class="active">作品専用</button><button id="scopeShared">共通</button><button class="primary" id="addAsset">＋ アセット登録</button></div><div id="assetForm" class="hidden"><label>名前</label><input id="assetName" placeholder="例：主人公_制服_正面"><label>分類</label><select id="assetCategory"><option>キャラクター</option><option>背景</option><option>小物</option><option>衣装</option><option>表情・ポーズ</option><option>効果・トーン</option><option>吹き出し</option></select><label>設定・固定特徴</label><textarea id="assetNotes" placeholder="AIが維持すべき特徴を記入"></textarea><label>参照画像（任意）</label><input id="assetImage" type="file" accept="image/*"><button class="primary" id="saveAsset">登録する</button><button id="cancelAsset">キャンセル</button><p class="muted">画像は端末内のIndexedDBに保存します。容量制限に注意してください。</p></div><div id="assetList" class="grid"></div></section><section id="editor" class="panel hidden"><h2>5レイヤー原稿編集（試作）</h2><p class="muted">Apple Pencilで描画できます。原稿の出力解像度は4299×6071px。現段階は軽量プレビュー描画です。</p><div class="editor"><div class="layers"><h3>レイヤー</h3><div id="layerList"></div><label>ツール</label><select id="drawTool"><option value="pen">ペン</option><option value="eraser">消しゴム</option></select><label>線の太さ</label><input id="brushSize" type="range" min="1" max="30" value="4"><button id="undoStroke">1画戻す</button><button id="exportPreview">プレビューPNG出力</button></div><div class="canvasWrap"><canvas id="editorCanvas" width="860" height="1214"></canvas></div></div><p class="muted">この編集画面は試作です。コマ編集、吹き出しテンプレート、フル解像度PNG・ZIP出力、AI分離は未実装です。</p></section></main><script>
const KEY='aiclip_v02';let db,assetScope='project',activeTab='projects',strokes=[],activeLayer='人物',drawing=false,currentStroke=null;const layerNames=['セリフ・吹き出し','効果・演出','コマ','人物','背景'];let visible=Object.fromEntries(layerNames.map(x=>[x,true]));let data={projects:[{id:'sample',title:'新しい漫画',genre:'',world:'',synopsis:'',sceneTitle:'第1話',sceneBody:''}],current:'sample',assets:[]};const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());function current(){return data.projects.find(p=>p.id===data.current)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveStatus').textContent='保存済み'}catch(e){alert('保存できません。端末の空き容量を確認してください。')}}try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved?.projects?.length)data=saved}catch(e){}function tab(name){activeTab=name;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==name));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));if(name==='projects')renderProjects();if(name==='story'||name==='script')fillFields();if(name==='assets')renderAssets();if(name==='editor')renderEditor()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function renderProjects(){let root=$('projectList');root.replaceChildren();data.projects.forEach(p=>{let el=document.createElement('div');el.className='asset';let h=document.createElement('h3');h.textContent=p.title||'無題の作品';let info=document.createElement('p');info.className='muted';info.textContent=p.genre||'ジャンル未設定';let btn=document.createElement('button');btn.textContent=p.id===data.current?'編集中':'この作品を開く';btn.onclick=()=>{data.current=p.id;persist();tab('story')};el.append(h,info,btn);root.append(el)})}function fillFields(){let p=current();['title','genre','world','synopsis','sceneTitle','sceneBody'].forEach(k=>$(k).value=p[k]||'')}function saveFields(){let p=current();['title','genre','world','synopsis','sceneTitle','sceneBody'].forEach(k=>p[k]=$(k).value);persist()}$('newProject').onclick=()=>{let name=prompt('作品名を入力','新しい漫画');if(name===null)return;let p={id:uid(),title:name.trim()||'無題の作品',genre:'',world:'',synopsis:'',sceneTitle:'第1話',sceneBody:''};data.projects.push(p);data.current=p.id;persist();tab('story')};$('saveStory').onclick=saveFields;$('saveScript').onclick=saveFields;['title','genre','world','synopsis','sceneTitle','sceneBody'].forEach(k=>$(k).addEventListener('change',saveFields));function download(blob,name){let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('exportData').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'aiclip-backup.json');$('importData').onclick=()=>$('backupFile').click();$('backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.projects)||!Array.isArray(x.assets))throw Error();if(confirm('現在の作品情報をバックアップの内容で置き換えますか？')){data=x;persist();tab('projects')}}catch(e){alert('バックアップ形式が正しくありません')}};
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('AIClipStudioAssets',1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>{db=req.result;resolve()};req.onerror=()=>reject(req.error)})}function putImage(id,blob){return new Promise((resolve,reject)=>{let tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}function getImage(id){return new Promise(resolve=>{if(!db)return resolve(null);let req=db.transaction('images').objectStore('images').get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>resolve(null)})}function setScope(s){assetScope=s;$('scopeProject').classList.toggle('active',s==='project');$('scopeShared').classList.toggle('active',s==='shared');renderAssets()}$('scopeProject').onclick=()=>setScope('project');$('scopeShared').onclick=()=>setScope('shared');$('addAsset').onclick=()=>$('assetForm').classList.remove('hidden');$('cancelAsset').onclick=()=>$('assetForm').classList.add('hidden');$('saveAsset').onclick=async()=>{let name=$('assetName').value.trim();if(!name)return alert('名前を入力してください');let id=uid(),f=$('assetImage').files[0];if(f){if(!db)return alert('画像保存領域が利用できません');await putImage(id,f)}data.assets.push({id,name,category:$('assetCategory').value,notes:$('assetNotes').value,scope:assetScope,projectId:assetScope==='project'?data.current:null,hasImage:!!f,status:'承認済み',version:1});persist();$('assetForm').classList.add('hidden');$('assetName').value='';$('assetNotes').value='';$('assetImage').value='';renderAssets()};async function renderAssets(){let root=$('assetList');root.replaceChildren();let list=data.assets.filter(a=>a.scope===assetScope&&(assetScope==='shared'||a.projectId===data.current));if(!list.length){let p=document.createElement('p');p.className='muted';p.textContent='まだアセットがありません。＋ アセット登録から追加してください。';root.append(p)}for(let a of list){let el=document.createElement('div');el.className='asset';if(a.hasImage){let blob=await getImage(a.id);if(blob){let img=document.createElement('img'),url=URL.createObjectURL(blob);img.src=url;img.onload=()=>URL.revokeObjectURL(url);el.append(img)}}let h=document.createElement('h3');h.textContent=a.name;let meta=document.createElement('p');meta.className='muted';meta.textContent=`${a.category} ・ ${a.status} ・ v${a.version}`;let note=document.createElement('p');note.textContent=a.notes||'';el.append(h,meta,note);let b=document.createElement('button');b.textContent=a.scope==='project'?'共通へコピー':'作品へコピー';b.onclick=async()=>{let id=uid();data.assets.push({...a,id,scope:a.scope==='project'?'shared':'project',projectId:a.scope==='project'?null:data.current});if(a.hasImage){let blob=await getImage(a.id);if(blob)await putImage(id,blob)}persist();alert('コピーしました')};el.append(b);root.append(el)}}
const canvas=$('editorCanvas'),ctx=canvas.getContext('2d');function renderEditor(){let root=$('layerList');root.replaceChildren();layerNames.forEach(n=>{let div=document.createElement('div');div.className='layer';let label=document.createElement('label');label.textContent=n;let eye=document.createElement('input');eye.type='checkbox';eye.checked=visible[n];eye.style.width='auto';eye.onchange=()=>{visible[n]=eye.checked;drawCanvas()};let radio=document.createElement('input');radio.type='radio';radio.name='layer';radio.style.width='auto';radio.checked=n===activeLayer;radio.onchange=()=>activeLayer=n;div.append(eye,label,radio);root.append(div)});drawCanvas()}function drawCanvas(){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);for(let s of strokes){if(!visible[s.layer]||s.points.length<1)continue;ctx.strokeStyle=s.tool==='eraser'?'#fff':'#111';ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(s.points.length===1)ctx.lineTo(s.points[0].x+.01,s.points[0].y+.01);ctx.stroke()}}function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;currentStroke={layer:activeLayer,tool:$('drawTool').value,size:+$('brushSize').value,points:[pos(e)]};strokes.push(currentStroke);drawCanvas()};canvas.onpointermove=e=>{if(!drawing)return;currentStroke.points.push(pos(e));drawCanvas()};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;currentStroke=null};$('undoStroke').onclick=()=>{strokes.pop();drawCanvas()};$('exportPreview').onclick=()=>canvas.toBlob(b=>b&&download(b,'manga-preview-860x1214.png'));openDB().catch(()=>{$('saveStatus').textContent='画像保存不可'});tab('projects');
</script></body></html>
